# WhatsCRM on Coolify Cloud.
# All secrets and config come from Coolify env vars, never from repo files.
# Set in Coolify: PORT, DBHOST=db, DBNAME, DBUSER, DBPASS, DBPORT=3306,
# JWTKEY, FRONTENDURI, BACKURI, STRIPE_LANG, NODE_ENV
services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DBPASS}
      MARIADB_DATABASE: ${DBNAME}
      MARIADB_USER: ${DBUSER}
      MARIADB_PASSWORD: ${DBPASS}
    volumes:
      # v4: no healthcheck on purpose. Compose marked db unhealthy after 12s
      # despite start_period 90s, aborting the deploy mid-import twice. Without
      # a healthcheck, compose starts db and app, and the app reconnects once
      # MariaDB finishes importing. Fresh volume forces a full re-import.
      # No real user data existed yet.
      - whatscrm-db-v4:/var/lib/mysql
      # No entrypoint bind mount: Coolify does not honour it for the db
      # service, so the schema was never imported. The app container imports
      # database/import.sql itself on first start via scripts/init-db.js.

  app:
    build: .
    restart: always
    environment:
      PORT: ${PORT:-3010}
      DBHOST: db
      DBNAME: ${DBNAME}
      DBUSER: ${DBUSER}
      DBPASS: ${DBPASS}
      DBPORT: "3306"
      JWTKEY: ${JWTKEY}
      FRONTENDURI: ${FRONTENDURI}
      BACKURI: ${BACKURI}
      STRIPE_LANG: ${STRIPE_LANG:-en}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      - db
    volumes:
      - whatscrm-sessions:/app/sessions

volumes:
  whatscrm-db-v4: {}
  whatscrm-sessions: {}
