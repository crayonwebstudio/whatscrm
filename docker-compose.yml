# WhatsCRM on Coolify Cloud.
# All secrets and config come from Coolify env vars, never from repo files.
# Set in Coolify: PORT, DBHOST=db, DBNAME, DBUSER, DBPASS, DBPORT=3306,
# JWTKEY, FRONTENDURI, BACKURI, STRIPE_LANG, NODE_ENV
services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DBPASS}
      MARIADB_DATABASE: ${DBNAME}
      MARIADB_USER: ${DBUSER}
      MARIADB_PASSWORD: ${DBPASS}
    volumes:
      # v2: first deploy's DB init was interrupted by the broken healthcheck,
      # leaving a partial schema (user, qr_campaigns, warmers missing, so login
      # fails with "something went wrong"). Fresh volume forces a full re-import
      # with the fixed healthcheck. No real user data existed yet.
      - whatscrm-db-v2:/var/lib/mysql
      - ./database/import.sql:/docker-entrypoint-initdb.d/import.sql:ro
    healthcheck:
      # MariaDB image ships healthcheck.sh, which uses MARIADB_ROOT_PASSWORD.
      # Plain mariadb-admin ping without credentials fails when a root password is set,
      # so the container never became healthy and compose aborted the deploy.
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

  app:
    build: .
    restart: always
    environment:
      PORT: ${PORT:-3010}
      DBHOST: db
      DBNAME: ${DBNAME}
      DBUSER: ${DBUSER}
      DBPASS: ${DBPASS}
      DBPORT: "3306"
      JWTKEY: ${JWTKEY}
      FRONTENDURI: ${FRONTENDURI}
      BACKURI: ${BACKURI}
      STRIPE_LANG: ${STRIPE_LANG:-en}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - whatscrm-sessions:/app/sessions

volumes:
  whatscrm-db-v2: {}
  whatscrm-sessions: {}
